# Collect real Everland review data on a GitHub-hosted runner.
#
# The Claude Code sandbox environment cannot reach naver.com (egress policy),
# so collection runs here instead: discover real Everland food venues from
# Naver Map search, run the collector for a small capped batch, and commit the
# raw + normalized outputs back to this branch for analysis.
#
# Triggering: workflow_dispatch works once this file is on the default
# branch. Until then, a push to the collection branch whose commit message
# contains the marker '[collect]' starts a run; the results commit the run
# itself pushes carries no marker, so it cannot retrigger.

name: collect-reviews

on:
  push:
    branches:
      - "claude/everland-review-collector-baii8v"
  workflow_dispatch:
    inputs:
      queries:
        description: "Comma-separated Naver Map search queries for target discovery"
        default: "에버랜드 레스토랑,에버랜드 맛집,에버랜드 카페"
      max_targets:
        description: "How many verified venues to put in the config"
        default: "3"
      only:
        description: "Collect only restaurants whose name contains this substring (empty = first target only)"
        default: ""
      max_reviews:
        description: "Review cap per restaurant"
        default: "100"
      delay:
        description: "Seconds between pagination interactions"
        default: "2.0"
      skip_discovery:
        description: "Set to 'true' to reuse the committed config instead of re-discovering"
        default: "false"

permissions:
  contents: write

concurrency:
  group: collect-reviews-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[collect]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IN_QUERIES: ${{ inputs.queries || '에버랜드 레스토랑,에버랜드 맛집,에버랜드 카페' }}
      IN_MAX_TARGETS: ${{ inputs.max_targets || '3' }}
      IN_ONLY: ${{ inputs.only || '' }}
      IN_MAX_REVIEWS: ${{ inputs.max_reviews || '100' }}
      IN_DELAY: ${{ inputs.delay || '2.0' }}
      IN_SKIP_DISCOVERY: ${{ inputs.skip_discovery || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Discover Everland targets
        if: ${{ env.IN_SKIP_DISCOVERY != 'true' }}
        run: |
          mkdir -p logs
          IFS=',' read -ra QUERIES <<< "$IN_QUERIES"
          ARGS=()
          for q in "${QUERIES[@]}"; do ARGS+=(--query "$q"); done
          python scripts/discover_places.py "${ARGS[@]}" \
            --max-targets "$IN_MAX_TARGETS" 2>&1 | tee logs/discovery.log

      - name: Collect reviews
        id: collect
        run: |
          mkdir -p logs
          ONLY_ARGS=()
          if [ -n "$IN_ONLY" ]; then
            ONLY_ARGS=(--only "$IN_ONLY")
          fi
          python scripts/collect_reviews.py \
            "${ONLY_ARGS[@]}" \
            --max-reviews "$IN_MAX_REVIEWS" \
            --delay "$IN_DELAY" \
            --debug-dir logs 2>&1 | tee logs/collect.log

      - name: Commit results to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f logs/ || true
          git add config/restaurants.yaml || true
          git add -f data/raw/*.json data/normalized/* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Collection run ${{ github.run_id }} (cap: $IN_MAX_REVIEWS)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
