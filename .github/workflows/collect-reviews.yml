# Collect real Everland review data on a GitHub-hosted runner.
#
# The Claude Code sandbox environment cannot reach naver.com (egress policy),
# so collection runs here instead: discover real Everland food venues from
# Naver Map search, run the collector for a small capped batch, and commit the
# raw + normalized outputs back to this branch for analysis.
#
# Triggering: workflow_dispatch works once this file is on the default
# branch. Until then, a push to the collection branch drives it by commit
# message marker:
#     [collect]               full crawl of the default location (everland)
#     [collect:sinlicheon]    re-discover, then crawl that location
#     [recollect:sinlicheon]  crawl the committed target list as-is, skipping
#                             discovery -- use when the venue list has already
#                             been reviewed, or to refresh reviews later
#     [discover:sinlicheon]   discovery only -- verify the venue list first,
#                             without spending an hour collecting
# The results commit the run pushes carries no marker, so it cannot retrigger.

name: collect-reviews

on:
  push:
    branches:
      - "claude/everland-review-collector-baii8v"
  workflow_dispatch:
    inputs:
      location:
        description: "Location key from config/locations.yaml"
        default: "everland"
      discover_only:
        description: "Set to 'true' to stop after discovery"
        default: "false"
      queries:
        description: "Comma-separated Naver Map search queries for target discovery"
        default: ""   # empty = the script's full default query set
      max_targets:
        description: "How many verified venues to put in the config"
        default: "30"
      only:
        description: "Collect only restaurants whose name contains this substring (empty = first target only)"
        default: ""
      max_reviews:
        description: "Review cap per restaurant"
        default: "200"
      delay:
        description: "Seconds between pagination interactions"
        default: "2.0"
      skip_discovery:
        description: "Set to 'true' to reuse the committed config instead of re-discovering"
        default: "false"

permissions:
  contents: write

concurrency:
  group: collect-reviews-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[collect')
      || contains(github.event.head_commit.message, '[recollect')
      || contains(github.event.head_commit.message, '[discover')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      IN_QUERIES: ${{ inputs.queries || '' }}
      IN_LOCATION: ${{ inputs.location || '' }}
      IN_DISCOVER_ONLY: ${{ inputs.discover_only || '' }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      IN_MAX_TARGETS: ${{ inputs.max_targets || '30' }}
      IN_ONLY: ${{ inputs.only || '' }}
      IN_MAX_REVIEWS: ${{ inputs.max_reviews || '200' }}
      IN_DELAY: ${{ inputs.delay || '2.0' }}
      IN_SKIP_DISCOVERY: ${{ inputs.skip_discovery || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Resolve location and mode
        id: mode
        run: |
          location="$IN_LOCATION"
          discover_only="$IN_DISCOVER_ONLY"
          # A commit marker overrides the (empty) push-event inputs.
          skip_discovery="$IN_SKIP_DISCOVERY"
          marker=$(printf '%s' "$COMMIT_MESSAGE" | head -1 \
            | grep -oE '\[(collect|recollect|discover)(:[a-z0-9_-]+)?\]' | head -1 || true)
          if [ -n "$marker" ]; then
            kind=$(printf '%s' "$marker" | sed -E 's/^\[([a-z]+).*/\1/')
            key=$(printf '%s' "$marker" | sed -E 's/^\[[a-z]+:?([a-z0-9_-]*)\]$/\1/')
            [ -n "$key" ] && location="$key"
            [ "$kind" = "discover" ] && discover_only=true
            # recollect crawls exactly the venue list already committed.
            [ "$kind" = "recollect" ] && skip_discovery=true
          fi
          location="${location:-everland}"
          discover_only="${discover_only:-false}"
          skip_discovery="${skip_discovery:-false}"
          echo "skip_discovery=$skip_discovery" >> "$GITHUB_OUTPUT"
          echo "location=$location"        >> "$GITHUB_OUTPUT"
          echo "discover_only=$discover_only" >> "$GITHUB_OUTPUT"
          echo "targets=config/targets/$location.yaml" >> "$GITHUB_OUTPUT"
          echo "resolved: location=$location discover_only=$discover_only skip_discovery=$skip_discovery"

      - name: Discover targets
        if: ${{ steps.mode.outputs.skip_discovery != 'true' }}
        run: |
          mkdir -p logs
          ARGS=()
          if [ -n "$IN_QUERIES" ]; then
            IFS=',' read -ra QUERIES <<< "$IN_QUERIES"
            for q in "${QUERIES[@]}"; do ARGS+=(--query "$q"); done
          fi
          python scripts/discover_places.py "${ARGS[@]}" \
            --location "${{ steps.mode.outputs.location }}" \
            --config "${{ steps.mode.outputs.targets }}" \
            --max-targets "$IN_MAX_TARGETS" \
            2>&1 | tee "logs/discovery_${{ steps.mode.outputs.location }}.log"

      - name: Collect reviews
        id: collect
        if: ${{ steps.mode.outputs.discover_only != 'true' }}
        run: |
          mkdir -p logs
          ONLY_ARGS=()
          if [ -n "$IN_ONLY" ]; then
            ONLY_ARGS=(--only "$IN_ONLY")
          fi
          python scripts/collect_reviews.py \
            --config "${{ steps.mode.outputs.targets }}" \
            "${ONLY_ARGS[@]}" \
            --max-reviews "$IN_MAX_REVIEWS" \
            --delay "$IN_DELAY" \
            --time-budget 4200 \
            --debug-dir logs 2>&1 | tee "logs/collect_${{ steps.mode.outputs.location }}.log"

      - name: Commit results to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f logs/ || true
          git add config/targets/ config/restaurants.yaml 2>/dev/null || true
          git add -f data/raw/*.json data/normalized/* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # No [collect]/[discover] marker here, so the results commit
          # cannot retrigger the workflow.
          git commit -m "${{ steps.mode.outputs.location }}: run ${{ github.run_id }}"
          # The branch can move while a run is collecting (another push, an
          # overlapping run). A plain push is then rejected and an hour of
          # collected data dies with the runner, so rebase onto whatever
          # landed and retry instead of giving up.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto remote"
            git fetch origin "${{ github.ref_name }}"
            # Collected files are per-run (timestamped names), so a rebase
            # conflict is not expected; keep our side if one appears anyway.
            git rebase "origin/${{ github.ref_name }}" \
              || git rebase --strategy-option=ours --continue \
              || git rebase --abort
            sleep $((attempt * 5))
          done
          echo "::error::could not push collected results after 5 attempts"
          exit 1
